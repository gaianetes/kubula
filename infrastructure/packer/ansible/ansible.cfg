[defaults]
# nocows = True
roles_path = ./roles
become = True
host_key_checking = False
deprecation_warnings = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ConnectTimeout=13 -o IdentitiesOnly=yes 
pipelining = False