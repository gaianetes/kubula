apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-cilium
  namespace: kube-system
spec:
  valuesContent: |-
    tls:
      ca:
        cert: 
        key: 
    bpf:
      masquerade: true
    cluster:
      name: cilium-demo-cluster2
      id: 02
    prometheus:
      enabled: True
      serviceMonitor:
        enabled: False
    dashboards:
      enabled: True
    hubble:
      enabled: True
      metrics:
        enabled:
        - dns:query;ignoreAAAA
        - drop
        - tcp
        - flow
        - icmp
        - http
        dashboards:
          enabled: True
        serviceMonitor:
          enabled: False
      relay:
        enabled: True
        prometheus:
          enabled: True
          serviceMonitor:
            enabled: False
      ui:
        enabled: True
        baseUrl: /
    version: 1.16.1
    operator:
      replicas: 1
      prometheus:
        enabled: True
        serviceMonitor:
          enabled: False
      dashboards:
        enabled: True
    envoy:
      prometheus:
        enabled: True
        serviceMonitor:
          enabled: False
        service:
          type: NodePort
          nodePort: 32380
        tls:
          authMode: cluster
          server:
            extraDnsNames:
              - "*.cilium-demo-cluster2.kubula.internal"
    clustermesh:
      apiserver:
        metrics:
          enabled: True
          serviceMonitor:
            enabled: False
      config:
        enabled: true
        domain: cilium-demo-cluster2.kubula.internal
        clusters:
          - name: cilium-demo-cluster1
            address: cilium-demo-cluster1.kubula.internal
            port: 32379
      useAPIServer: true
    kubeProxyReplacement: True
    ipam:
      mode: "cluster-pool"
      operator:
        clusterPoolIPv4PodCIDRList: 
          - "10.43.0.0/16"
        clusterPoolIPv4MaskSize: 16
    socketLB:
      hostNamespaceOnly: true
    ipv4:
      enabled: true
    nodePort:
      enabled: true