---
- name: Create the rke2 directory
  become: true
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    owner: root
    group: root
    mode: "0644"
- name: Create the rke2 server directory
  become: true
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/server
    state: directory
    owner: root
    group: root
    mode: "0644"
  when: rke2_role == "server"
- name: Create the rke2 agent directory
  become: true
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/agent
    state: directory
    owner: root
    group: root
    mode: "0644"
  when: rke2_role == "agent"
- name: Create the RKE2 images directory
  become: true
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/agent/images
    state: directory
    owner: root
    group: root
    mode: "0644"
- name: Download RKE2 Images tar
  become: true
  ansible.builtin.get_url:
    url: "{{ rke2_images_url }}"
    dest: /var/lib/rancher/rke2/agent/images
  when: rke2_download_images == true

- name: Create /etc/rancher/rke2/ directory
  when: rke2_role == "server"
  become: true
  ansible.builtin.file:
    path: /etc/rancher/rke2/
    state: directory
    mode: '0755'

# Create static manifests directory
- name: Create /var/lib/rancher/rke2/server/manifests/ directory
  when: rke2_role == "server"
  become: true
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/server/manifests/
    state: directory
    mode: '0755'

- name: Create config.yaml with RKE2 configuration
  become: true
  template:
    src: templates/rke2/config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: '0644'
  when: rke2_role == "server"
- name: Create Cilium HelmConfig
  become: true
  template:
    src: templates/rke2/cilium-helm-config.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
    mode: '0644'
  when: rke2_role == "server"

# Install RKE2
- name: Install RKE2
  become: true
  ansible.builtin.shell:
    cmd: "curl -sfL https://get.rke2.io | sudo INSTALL_RKE2_CHANNEL=latest INSTALL_RKE2_VERSION={{ rke2_version }} INSTAL_RKE2-TYPE={{ rke2_role }} sh -"

- name: Start RKE2
  become: true
  ansible.builtin.systemd:
    name: rke2-{{ rke2_role }}
    state: started
    enabled: yes

- name: Copy kubeconfig to user home
  become: true
  ansible.builtin.shell:
    cmd: "sudo cp /etc/rancher/rke2/rke2.yaml /home/{{ init_user_name }}/.kube/config && sudo chown {{ init_user_name }}:{{ init_user_name }} /home/{{ init_user_name }}/.kube/config"
  when: rke2_role == "server"

