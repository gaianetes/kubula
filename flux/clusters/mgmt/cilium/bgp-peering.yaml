apiVersion: "cilium.io/v2alpha1"
kind: CiliumBGPPeeringPolicy
metadata:
  name: tor
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: "linux"
      # kubernetes.io/hostname: "c1cp1.smigula.internal"
  virtualRouters:
  - localASN: 65001
    exportPodCIDR: true
    serviceSelector:
      matchLabels:
        advertise: "cilium"
    neighbors:
    - peerAddress: "192.168.1.11/32"
      peerASN: 65000