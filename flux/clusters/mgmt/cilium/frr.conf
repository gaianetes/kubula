log syslog notifications
frr defaults traditional
!
router bgp 65000
no bgp ebgp-requires-policy
bgp router-id 192.168.1.11
neighbor 192.168.1.12 remote-as 65001
neighbor 192.168.1.12 update-source eth0
neighbor 192.168.1.12 soft-reconfiguration inbound
neighbor 192.168.1.13 remote-as 65001
neighbor 192.168.1.13 update-source eth0
neighbor 192.168.1.13 soft-reconfiguration inbound
address-family ipv4 unicast
neighbor 192.168.1.12 next-hop-self
neighbor 192.168.1.13 next-hop-self
exit-address-family
!
address-family ipv6 unicast
exit-address-family
!
line vty