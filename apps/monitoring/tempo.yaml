# Application to point to charts/alloy
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    repoURL: https://tempo.github.io/helm-charts
    targetRevision: 1.10.0
    chart: tempo
    helm:
      releaseName: tempo
      values: |-
        global:
          dnsService: "rke2-coredns-rke2-coredns"
        serviceMonitor:
          enabled: true
        gateway:
          enabled: true
        ingester:
          replicas: 2
        metricsGenerator:
          enabled: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # syncOptions:
    #   - ServerSideApply=true
    #   - CreateNamespace=true
    #   - Replace=true